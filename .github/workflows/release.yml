name: Publish Version

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.3.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Test production tool
        run: python -m unittest discover -s factory/tests -v

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install Arduino libraries
        run: |
          arduino-cli lib install "pdulib@0.5.11"
          arduino-cli lib install "ReadyMail@0.4.2"
          arduino-cli lib install "ArduinoJson@7.4.2"

      - name: Test push protocol
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            -I ./code \
            -I "$HOME/Arduino/libraries/ArduinoJson/src" \
            ./code/push_protocol.cpp ./tests/push_protocol_test.cpp \
            -o /tmp/push_protocol_test
          /tmp/push_protocol_test

      - name: Validate embedded UI JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('code/web_html.cpp').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('embedded script not found')
          Path('/tmp/web-ui.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/web-ui.js

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:makergo_c3_supermini \
            --board-options PartitionScheme=no_ota \
            --output-dir ./fw \
            ./code

      - name: Create versioned firmware ZIP
        run: |
          python ./factory/make_manifest.py ./fw ./release/firmware
          EXPECTED="sukiyra-${RELEASE_TAG#v}"
          ACTUAL="$(python -c 'import json; print(json.load(open("release/firmware/manifest.json", encoding="utf-8"))["version"])')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Firmware version $ACTUAL does not match release tag $RELEASE_TAG (expected $EXPECTED)" >&2
            exit 1
          fi
          cd ./release/firmware
          zip -q -9 -r "../sms-forwarder-firmware-${RELEASE_TAG}.zip" .

      - name: Upload firmware release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: ./release/sms-forwarder-firmware-*.zip

  windows-tool:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 flashing tool
        shell: pwsh
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Build Windows production tool
        shell: pwsh
        run: |
          python -m pip install -r ./factory/build-requirements.txt
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name sms-forwarder-production-tool `
            --hidden-import serial --hidden-import serial.tools.list_ports `
            ./factory/production_tool.py
          New-Item -ItemType Directory -Force ./release/tool | Out-Null
          Copy-Item ./dist/sms-forwarder-production-tool.exe ./release/tool/
          Copy-Item ./factory/README.md ./release/tool/README.md
          Copy-Item ./LICENSE ./release/tool/
          Copy-Item ./NOTICE ./release/tool/
          $esptool = Get-ChildItem "$env:LOCALAPPDATA\Arduino15\packages\esp32\tools\esptool_py" -Filter esptool.exe -Recurse | Select-Object -First 1
          if (-not $esptool) { throw 'esptool.exe not found after ESP32 core install' }
          Copy-Item $esptool.FullName ./release/tool/esptool.exe
          Compress-Archive -Path ./release/tool/* -DestinationPath "./release/sms-forwarder-production-tool-windows-${env:RELEASE_TAG}.zip" -CompressionLevel Optimal

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-tool
          path: ./release/sms-forwarder-production-tool-windows-*.zip

  publish:
    needs: [firmware, windows-tool]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: ./release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./release-assets/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" ./release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SMS Forwarder Board ${RELEASE_TAG}" \
              --generate-notes
          fi
