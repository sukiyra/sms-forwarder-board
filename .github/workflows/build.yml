name: Build Arduino Firmware

on:
  push:
    paths:
      - 'code/**'
      - 'factory/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Test production tool
      run: python -m unittest discover -s factory/tests -v

    - name: Install ESP32 platform
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.3.11

    - name: Install dependencies
      run: |
        arduino-cli lib install "pdulib@0.5.11"
        arduino-cli lib install "ReadyMail@0.4.2"
        arduino-cli lib install "ArduinoJson@7.4.2"

    - name: Test push protocol
      run: |
        g++ -std=c++17 -Wall -Wextra -pedantic \
          -I ./code \
          -I "$HOME/Arduino/libraries/ArduinoJson/src" \
          ./code/push_protocol.cpp ./tests/push_protocol_test.cpp \
          -o /tmp/push_protocol_test
        /tmp/push_protocol_test

    - name: Validate embedded UI JavaScript
      run: |
        python - <<'PY'
        import re
        from pathlib import Path
        source = Path('code/web_html.cpp').read_text(encoding='utf-8')
        match = re.search(r'<script>(.*?)</script>', source, re.S)
        if not match:
            raise SystemExit('embedded script not found')
        Path('/tmp/web-ui.js').write_text(match.group(1), encoding='utf-8')
        PY
        node --check /tmp/web-ui.js

    - name: Compile firmware
      run: |
        arduino-cli compile --fqbn esp32:esp32:makergo_c3_supermini --board-options PartitionScheme=no_ota --output-dir ./fw ./code

    - name: Create production firmware bundle
      run: python ./factory/make_manifest.py ./fw ./factory/dist

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: ./factory/dist/*

  factory-tool:
    needs: build
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Install ESP32 flashing tool
      shell: pwsh
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.3.11

    - name: Build standalone Windows tool
      shell: pwsh
      run: |
        python -m pip install -r ./factory/build-requirements.txt
        pyinstaller --noconfirm --clean --onefile --windowed `
          --name sms-forwarder-production-tool `
          --hidden-import serial --hidden-import serial.tools.list_ports `
          ./factory/production_tool.py
        New-Item -ItemType Directory -Force ./production-package/dist | Out-Null
        Copy-Item ./dist/sms-forwarder-production-tool.exe ./production-package/
        Copy-Item ./factory/README.md ./production-package/
        $esptool = Get-ChildItem "$env:LOCALAPPDATA\Arduino15\packages\esp32\tools\esptool_py" -Filter esptool.exe -Recurse | Select-Object -First 1
        if (-not $esptool) { throw 'esptool.exe not found after ESP32 core install' }
        Copy-Item $esptool.FullName ./production-package/esptool.exe

    - name: Download production firmware
      uses: actions/download-artifact@v5
      with:
        name: firmware
        path: ./production-package/dist

    - name: Upload Windows production package
      uses: actions/upload-artifact@v4
      with:
        name: production-package-windows
        path: ./production-package/*
