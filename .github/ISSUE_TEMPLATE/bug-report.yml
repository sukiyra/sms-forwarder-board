name: "故障报告"
description: "报告可复现的固件、管理台或量产工具问题"
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: 影响范围
      options:
        - 固件与短信
        - Web 管理台
        - 量产工具
        - GitHub 发布包
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 固件或工具版本
      placeholder: "例如 v1.3.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: 硬件
      description: 请填写 ESP32-C3 板型、ML307 完整料号和实体 SIM/eSIM 类型。
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题与复现步骤
      description: 请说明实际结果、预期结果和稳定复现步骤。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 请粘贴已移除手机号、ICCID、Wi-Fi 密码和推送密钥的日志。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，并确认没有相同问题。
          required: true
        - label: 我已删除日志中的隐私信息和密钥。
          required: true
